{% extends "base.html" %}
{% block title %}Criar secret — Vanishd{% endblock %}

{% block content %}
<div class="card">
  <div class="field">
    <label for="secret">Seu secret</label>
    <textarea id="secret" placeholder="Cole aqui a senha, token, mensagem ou qualquer dado sensível..."></textarea>
  </div>

  <div class="row">
    <div class="field">
      <label for="ttl">Expira em</label>
      <select id="ttl">
        <option value="3600">1 hora</option>
        <option value="86400" selected>24 horas</option>
        <option value="259200">3 dias</option>
        <option value="604800">7 dias</option>
      </select>
    </div>
    <div class="field">
      <label>Modo</label>
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="link" type="button">Link</button>
        <button class="mode-btn" data-mode="password" type="button">Senha</button>
      </div>
    </div>
  </div>

  <div id="password-field" class="field hidden">
    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="Senha que o destinatário vai digitar">
  </div>

  <button class="btn" id="submit-btn" type="button">Criar link seguro</button>

  <div class="result" id="result">
    <div class="badge badge-success">Link criado</div>
    <div class="result-url" id="result-url"></div>
    <button class="btn btn-outline" id="copy-btn" type="button">Copiar link</button>
    <p class="text-muted mt-1">Este link funciona uma única vez. Compartilhe apenas com o destinatário.</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let mode = 'link';

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('password-field').classList.toggle('hidden', mode !== 'password');
    });
  });

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const secret = document.getElementById('secret').value.trim();
    if (!secret) { alert('Digite o secret.'); return; }

    const ttl = parseInt(document.getElementById('ttl').value);
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = mode === 'password' ? 'Derivando chave...' : 'Cifrando...';

    try {
      let payload, linkKey;

      if (mode === 'link') {
        const key = await VanishCrypto.generateKey();
        const { ciphertext, iv } = await VanishCrypto.encrypt(secret, key);
        linkKey = await VanishCrypto.exportKey(key);
        payload = { ciphertext, iv, ttl };
      } else {
        const password = document.getElementById('password').value;
        if (!password) { alert('Digite a senha.'); btn.disabled = false; btn.textContent = 'Criar link seguro'; return; }
        const salt = VanishCrypto.randomSalt();
        const key = await VanishCrypto.deriveKey(password, salt);
        const { ciphertext, iv } = await VanishCrypto.encrypt(secret, key);
        payload = { ciphertext, iv, salt: VanishCrypto.saltToB64(salt), ttl };
      }

      btn.textContent = 'Enviando...';
      const res = await fetch('/api/secrets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) throw new Error('Falha ao criar o secret.');
      const { id } = await res.json();

      const url = `${location.origin}/s/${id}${linkKey ? '#' + linkKey : ''}`;
      document.getElementById('result-url').textContent = url;
      document.getElementById('result').classList.add('show');
      document.getElementById('secret').value = '';
      if (mode === 'password') document.getElementById('password').value = '';
    } catch (err) {
      alert(err.message || 'Erro ao criar o secret.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Criar link seguro';
    }
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    const url = document.getElementById('result-url').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copiado!';
      setTimeout(() => { btn.textContent = 'Copiar link'; }, 2000);
    });
  });
</script>
{% endblock %}
