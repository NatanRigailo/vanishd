name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install flake8

      - name: flake8
        run: flake8 app/ --max-line-length=100

      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        run: |
          curl -sLo /tmp/dl-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash /tmp/dl-actionlint.bash 1.7.7
          ./actionlint -color

  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: lint
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install bandit pip-audit

      - name: bandit
        run: bandit -r app/ -ll

      - name: pip-audit
        run: pip-audit -r requirements.txt

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=app --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    needs: lint
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: jest
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage-js/lcov.info

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, sast, test, secret-scan]
    if: >
      always() &&
      needs.lint.result == 'success' &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.secret-scan.result == 'success' || needs.secret-scan.result == 'skipped')
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vanishd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vanishd:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vanishd:ci
          cache-from: type=gha

      - name: Start app
        run: |
          docker run -d --name vanishd-dast \
            -p 8080:8080 \
            -e SECRET_KEY=dast-ci-key \
            vanishd:ci

      - name: Wait for healthz
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz; then echo && exit 0; fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "App did not start in time"
          docker logs vanishd-dast
          exit 1

      - name: ZAP Baseline Scan
        run: |
          mkdir -p zap-output && chmod 777 zap-output
          docker run --rm --network host \
            -v "${{ github.workspace }}/.zap/rules.tsv:/zap/rules.tsv:ro" \
            -v "${{ github.workspace }}/zap-output:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8080 \
              -c /zap/rules.tsv \
              -r /zap/wrk/report.html \
              -w /zap/wrk/report.md \
              -I

      - name: ZAP report summary
        if: always()
        run: cat zap-output/report.md || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-output/report.html
            zap-output/report.md

      - name: Stop app
        if: always()
        run: docker stop vanishd-dast && docker rm vanishd-dast

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [lint, test, test-js]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-js
          path: coverage-js

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
